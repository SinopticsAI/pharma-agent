# Serverless Container spec. Placeholders are filled by scripts/deploy_containers.sh.
#
# network_id is not optional: the managed PostgreSQL cluster has no public host,
# so the container has to sit in the same cloud network to reach the pooler on
# port 6432.

name_prefix: pharma-agent

containers:
  - name: pharma-agent
    sa: pharma-agent-sa
    image_path: agent
    memory_mb: 1024
    cores: 1
    concurrency: 4
    # A turn is short, but a cold start plus extraction wait can add up. The
    # response is buffered either way — the container cannot stream.
    execution_timeout: 300s
    network_id: ${VPC_NETWORK_ID}
    public: false
    env:
      SECRET_BACKEND: lockbox
      LOCKBOX_SECRET_ID: ${LOCKBOX_SECRET_ID}
      FOLDER_ID: ${YC_FOLDER_ID}
      EDGE_API_BASE: ${EDGE_API_BASE}
      PG_HOST: ${PG_HOST}
      PG_PORT: "6432"
      PG_DATABASE: pharma_agent
      PG_USER: pharma_agent
      PG_SSLMODE: verify-full
      AI_STUDIO_BASE_URL: https://llm.api.cloud.yandex.net/v1
      AGENT_MODEL: ${AGENT_MODEL}
