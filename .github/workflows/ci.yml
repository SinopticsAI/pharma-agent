name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  image:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.push.outputs.tag }}
    env:
      YC_SA_JSON: ${{ secrets.YC_SA_JSON }}
      REGISTRY_ID: ${{ secrets.REGISTRY_ID }}
    steps:
      - name: Require image secrets
        if: env.YC_SA_JSON == '' || env.REGISTRY_ID == ''
        run: |
          echo "::error::YC_SA_JSON and REGISTRY_ID must be set. On main they publish the image and start deploy."
          exit 1

      - uses: actions/checkout@v5

      - name: Login to Yandex Container Registry
        run: |
          printf '%s\n' "$YC_SA_JSON" > sa.json
          docker login --username json_key --password-stdin cr.yandex < sa.json
          rm -f sa.json

      - name: Build and push
        id: push
        run: |
          TAG="${GITHUB_SHA::8}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          docker build -f docker/agent/Dockerfile -t "cr.yandex/$REGISTRY_ID/agent:$TAG" -t "cr.yandex/$REGISTRY_ID/agent:latest" .
          docker push "cr.yandex/$REGISTRY_ID/agent:$TAG"
          docker push "cr.yandex/$REGISTRY_ID/agent:latest"

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && needs.image.result == 'success'
    uses: ./.github/workflows/deploy_containers.yml
    with:
      image_tag: ${{ needs.image.outputs.tag }}
    secrets: inherit
