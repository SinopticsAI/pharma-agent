name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  image:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Map secrets here (allowed). Job/step `if` cannot read `secrets` directly.
    env:
      YC_SA_JSON: ${{ secrets.YC_SA_JSON }}
      REGISTRY_ID: ${{ secrets.REGISTRY_ID }}
    steps:
      - name: Skip image publish
        if: env.YC_SA_JSON == '' || env.REGISTRY_ID == ''
        run: |
          echo "YC_SA_JSON and/or REGISTRY_ID are not set."
          echo "Image publish skipped. Add both under Settings → Secrets and variables → Actions."

      - uses: actions/checkout@v5
        if: env.YC_SA_JSON != '' && env.REGISTRY_ID != ''

      - name: Login to Yandex Container Registry
        if: env.YC_SA_JSON != '' && env.REGISTRY_ID != ''
        run: |
          printf '%s\n' "$YC_SA_JSON" > sa.json
          docker login --username json_key --password-stdin cr.yandex < sa.json
          rm -f sa.json

      - name: Build and push
        if: env.YC_SA_JSON != '' && env.REGISTRY_ID != ''
        run: |
          TAG="${GITHUB_SHA::8}"
          docker build -f docker/agent/Dockerfile -t "cr.yandex/$REGISTRY_ID/agent:$TAG" -t "cr.yandex/$REGISTRY_ID/agent:latest" .
          docker push "cr.yandex/$REGISTRY_ID/agent:$TAG"
          docker push "cr.yandex/$REGISTRY_ID/agent:latest"
